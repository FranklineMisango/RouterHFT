# omnetpp.ini
# OMNeT++ configuration for HFT NIC simulation

[General]
network = routerhft.nic.HFT_NIC_Network
sim-time-limit = 10s
repeat = 1
cmdenv-express-mode = true
cmdenv-autoflush = true

# Logging
cmdenv-log-level = info
record-eventlog = true

# Statistics collection
*.gen.numPackets = 10000
*.gen.interArrivalTime = 100us
*.gen.packetSize = 256B

*.nic.queueSize = 2048
*.nic.timestampPrecisionNs = 1

*.cc.maxQueueLength = 1024
*.cc.dropThreshold = 0.95
*.cc.ecnThreshold = 0.70

# Vector recording
**.queueLengthVector.vector-recording = true
**.latencyVector.vector-recording = true
